name: 手動更新 KOCA 集章卡

# KOCA 會擋 GitHub 的主機（403），所以每日排程改在自己的 Mac 上跑（見 setup_mac.sh）。
# 這裡只保留手動執行，之後若 KOCA 不再擋，可以把 schedule 加回來：
#   schedule:
#     - cron: "47 15 * * *"   # 每天台北時間 23:47
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python koca_weekly.py
      - name: 存回 repo
        run: |
          git config user.name "koca-bot"
          git config user.email "koca-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "更新 $(TZ=Asia/Taipei date +%F)"
          git push
