name: 每日更新 KOCA 集章卡

on:
  schedule:
    - cron: "47 15 * * *"   # 每天台北時間 23:47
  workflow_dispatch:         # 也可以在 Actions 頁面手動按 Run

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python koca_weekly.py
      - name: 存回 repo
        run: |
          git config user.name "koca-bot"
          git config user.email "koca-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "更新 $(TZ=Asia/Taipei date +%F)"
          git push
